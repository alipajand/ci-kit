name: CI

# Starting point for a repository using ci-kit (README.md, "Adopting ci-kit"). Make "CI result"
# the only required check of each protected branch: it fails unless every job ran as the plan
# required, so a job skipped by mistake can't pass as "not needed".
#
# - A draft runs nothing but CI result, which fails it. Marking it ready runs CI; moving a pull
#   request back to draft cancels the in-flight run.
# - A pull request into a branch outside fullBranches runs the jobs its changes need, or nothing
#   but CI result when it changes only Markdown.
# - A pull request into main runs everything, including the release jobs (e2e). A push to main
#   runs every planned job, since the merged commit is not the one the pull request tested.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main is grouped by its commit, so a
# later merge never cancels an earlier one's validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change impact
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # remerge: whether CI passed on an earlier head
      contents: read
      pull-requests: read # the merge-conflict check
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      test-api: ${{ fromJSON(steps.plan.outputs.jobs)['test-api'] }}
      test-web: ${{ fromJSON(steps.plan.outputs.jobs)['test-web'] }}
      migrations: ${{ fromJSON(steps.plan.outputs.jobs)['migrations'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the plan diffs against the base and inspects merges

      - name: Plan the jobs
        id: plan
        uses: alipajand/ci-kit/plan@0000000000000000000000000000000000000000 # vX.Y.Z: replace with a release commit SHA

  # Always-run: lint, typecheck, build and the repository's own guards. Skipped on a draft and on a
  # Markdown-only plan; runs whenever the plan failed.
  build:
    name: Lint, typecheck, build
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.mode != 'markdown') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Merge conflict
        if: github.event_name == 'pull_request'
        uses: alipajand/ci-kit/merge-conflict@0000000000000000000000000000000000000000 # vX.Y.Z: replace with a release commit SHA

      - name: Workflow rules
        uses: alipajand/ci-kit/lint@0000000000000000000000000000000000000000 # vX.Y.Z: replace with a release commit SHA

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install, lint, typecheck, build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

  # Agent readiness: scores the repository for AI coding agents and audits its agent instruction
  # files (AGENTS.md, CLAUDE.md, Cursor and Copilot rules). A pull request may not lower the score.
  # Agent instruction files never count as Markdown-only, so a change to one always runs this.
  agents:
    name: Agent readiness
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.mode != 'markdown') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the score baseline and the review diff need the base

      - name: Agent readiness and instruction files
        uses: alipajand/agent-readiness-action@8e3b737539789992397b50496cf9c9ff23420b9e # v1.2.0
        with:
          min-score: "0" # raise to the current score once the job has run
          context-audit: "true"
          context-fail-on: medium
          baseline-ref: ${{ github.event.pull_request.base.sha }}
          max-score-drop: ${{ github.event_name == 'pull_request' && '0' || '' }}

      - name: Set up Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # Advisory: annotates the files a human should review before merge. Its config is read from
      # the base (HEAD^1 of the merge checkout), so a pull request can't change its own review.
      - name: Files that need human review (advisory)
        if: github.event_name == 'pull_request'
        env:
          REVIEWER: github:alipajand/agent-pr-reviewer-lite#71965e4dec2bd54075e0620a8b3be0622fba4666 # v1.0.0
        run: |
          if ! npm install --global --allow-git=all "$REVIEWER"; then
            echo "::warning::Couldn't install agent-pr-reviewer-lite; no review hints for this run."
            exit 0
          fi
          set +e
          agent-pr-reviewer-lite --base HEAD^1 --head HEAD --config-ref HEAD^1 --format github
          status=$?
          agent-pr-reviewer-lite --base HEAD^1 --head HEAD --config-ref HEAD^1 --format markdown >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::This pull request touches files that need a human review (job summary). Advisory only."
          fi
          exit 0

  # A planned job: needs the plan, runs unless the plan succeeded and said skip.
  test-api:
    name: Test (api)
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.test-api != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Test
        run: |
          npm ci
          npm test --workspace api

  test-web:
    name: Test (web, packages)
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.test-web != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Test
        run: |
          npm ci
          npm test --workspaces --if-present

  migrations:
    name: Migrations
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.migrations != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check migrations
        run: echo "Run the migration checks here."

  # A release job: every ready pull request into main, after the build passed; nowhere else.
  e2e:
    name: End-to-end
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'main' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: End-to-end tests
        run: echo "Run the browser suite here."

  result:
    name: CI result
    if: always()
    needs: [changes, build, agents, test-api, test-web, migrations, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The judge reads the config; nothing else of the checkout runs.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Check every job against the plan
        uses: alipajand/ci-kit/result@0000000000000000000000000000000000000000 # vX.Y.Z: replace with a release commit SHA
        with:
          needs: ${{ toJSON(needs) }}
