name: Bug report
description: ci-kit planned, judged or linted something wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security vulnerability, don't open an issue. Use private vulnerability reporting (SECURITY.md).
  - type: input
    id: version
    attributes:
      label: ci-kit version or commit
      placeholder: v1.1.0 / 64120b6
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options: [plan, result, merge-conflict, lint, CLI, templates, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the plan's mode and reason, or the CI result lines, from the job log.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: ci-kit config and the relevant workflow jobs
      description: Remove anything private first.
      render: json
