name: CI

# ci-kit's own CI, built from its own actions (`uses: ./plan` and so on), so every change is
# tested by the code it changes. Its one required check is "CI result".
#
# - A draft runs nothing but CI result, which fails it; marking it ready (or a push) runs again.
#   Moving a pull request back to draft cancels the in-flight run.
# - A pull request that changes only Markdown runs nothing but Change impact and CI result.
# - The tests run when the code, the tests or the actions change; the lint job always runs.
# - A push to main runs everything.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change impact
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      test: ${{ fromJSON(steps.plan.outputs.jobs)['test'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Plan the jobs
        id: plan
        uses: ./plan

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.mode != 'markdown') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Merge conflict
        if: github.event_name == 'pull_request'
        uses: ./merge-conflict

      - name: Workflow rules (ci-kit lint)
        uses: ./lint

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

      - name: zizmor
        run: pipx run "zizmor==$ZIZMOR_VERSION" --offline --min-severity medium .github/workflows templates/.github/workflows
        env:
          ZIZMOR_VERSION: "1.31.1"

  # Agent readiness: scores the repository for AI coding agents and audits its agent instruction
  # files (AGENTS.md, CLAUDE.md, Cursor and Copilot rules). A pull request may not lower the score.
  # Agent instruction files never count as Markdown-only, so a change to one always runs this.
  agents:
    name: Agent readiness
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.mode != 'markdown') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the score baseline and the review diff need the base

      - name: Agent readiness and instruction files
        uses: alipajand/agent-readiness-action@8e3b737539789992397b50496cf9c9ff23420b9e # v1.2.0
        with:
          min-score: "55"
          context-audit: "true"
          context-fail-on: medium
          baseline-ref: ${{ github.event.pull_request.base.sha }}
          max-score-drop: ${{ github.event_name == 'pull_request' && '0' || '' }}

      - name: Set up Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # Advisory: annotates the files a human should review before merge. Its config is read from
      # the base (HEAD^1 of the merge checkout), so a pull request can't change its own review.
      - name: Files that need human review (advisory)
        if: github.event_name == 'pull_request'
        env:
          REVIEWER: github:alipajand/agent-pr-reviewer-lite#71965e4dec2bd54075e0620a8b3be0622fba4666 # v1.0.0
        run: |
          if ! npm install --global --allow-git=all "$REVIEWER"; then
            echo "::warning::Couldn't install agent-pr-reviewer-lite; no review hints for this run."
            exit 0
          fi
          set +e
          agent-pr-reviewer-lite --base HEAD^1 --head HEAD --config-ref HEAD^1 --format github
          status=$?
          agent-pr-reviewer-lite --base HEAD^1 --head HEAD --config-ref HEAD^1 --format markdown >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::This pull request touches files that need a human review (job summary). Advisory only."
          fi
          exit 0

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.test != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Test
        run: npm test

  result:
    name: CI result
    if: always()
    needs: [changes, lint, agents, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check every job against the plan
        uses: ./result
        with:
          needs: ${{ toJSON(needs) }}
