name: Scorecard

# OpenSSF Scorecard: grades the repository's supply-chain practices (pinned dependencies, token
# permissions, branch protection, signed releases and more), uploads the findings to code
# scanning and publishes the score for the README badge. Its publishing rules allow only the
# steps below: no run steps, no top-level env or defaults.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # publish_results signs the results with the workflow's OIDC identity
      security-events: write # upload the SARIF to code scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
